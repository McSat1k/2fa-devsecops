
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
    <h1>Создание аккаунта</h1>

    <form action="/register" method="POST">
        <label>Логин:</label>
        <input
            type="text"
            name="username"
            minlength="3"
            maxlength="40"
            required
        >

        <br><br>

        <label>Пароль:</label>
        <input
            type="password"
            name="password"
            minlength="12"
            maxlength="72"
            required
        >

        <br><br>

        <button type="submit">
            Зарегистрироваться
        </button>
    </form>

    <p>
        Уже есть аккаунт?
        <a href="/login">Войти</a>
    </p>
</body>
</html>
